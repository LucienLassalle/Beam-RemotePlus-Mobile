name: Release

# Runs when a GitHub release is published (tag vX.Y.Z): builds the APKs,
# generates the SBOMs, signs the APKs and attaches everything to the release.
#
# Two jobs, so the signing key is only ever seen by a few lines of shell:
# - build: no secret at all. Third-party actions (Flutter, SBOM) run here.
# - sign: environment "release" (tags v* only, approval required), whose
#   secrets hold the key. No third-party action, only apksigner from the
#   runner's Android SDK. See docs/SIGNING.md.
on:
  release:
    types: [published]

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.7

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Version from the tag
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          IFS='.' read -r major minor patch <<< "${version%%-*}"
          echo "name=$version" >> "$GITHUB_OUTPUT"
          echo "code=$(( major * 10000 + minor * 100 + patch ))" >> "$GITHUB_OUTPUT"
      - name: Tests
        working-directory: app
        run: flutter pub get && flutter gen-l10n && flutter test
      - name: Build APKs
        working-directory: app
        env:
          NAME: ${{ steps.version.outputs.name }}
          CODE: ${{ steps.version.outputs.code }}
        # Signed with the debug key here (no key.properties); the sign job
        # replaces that signature with the release key.
        run: |
          flags="--release --obfuscate --split-debug-info=build/symbols --build-name=$NAME --build-number=$CODE"
          flutter build apk $flags --split-per-abi
          flutter build apk $flags
          mkdir -p ../dist
          out=build/app/outputs/flutter-apk
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "$out/app-$abi-release.apk" "../dist/Beam-RemotePlus-$NAME-$abi.apk"
          done
          cp "$out/app-release.apk" "../dist/Beam-RemotePlus-$NAME-universal.apk"
      - name: SBOM (SPDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: app
          format: spdx-json
          output-file: dist/Beam-RemotePlus-Mobile.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: SBOM (CycloneDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: app
          format: cyclonedx-json
          output-file: dist/Beam-RemotePlus-Mobile.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned
          path: dist/
          retention-days: 1
          if-no-files-found: error

  sign:
    name: Sign and publish
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Secrets of this environment only reach this job, after approval, and
    # only for a v* tag (environment settings, see docs/SIGNING.md).
    environment: release
    permissions:
      contents: write # upload release assets
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unsigned
          path: dist
      - name: Sign the APKs
        env:
          APK_KEYSTORE_BASE64: ${{ secrets.APK_KEYSTORE_BASE64 }}
          APK_KEYSTORE_PASSWORD: ${{ secrets.APK_KEYSTORE_PASSWORD }}
          APK_KEY_ALIAS: ${{ secrets.APK_KEY_ALIAS }}
          APK_CERT_SHA256: ${{ vars.APK_CERT_SHA256 }}
        run: |
          set -euo pipefail
          if [ -z "$APK_KEYSTORE_BASE64" ] || [ -z "$APK_KEYSTORE_PASSWORD" ] || [ -z "$APK_KEY_ALIAS" ] || [ -z "$APK_CERT_SHA256" ]; then
            echo "::error::Signing key or certificate fingerprint missing in the 'release' environment (docs/SIGNING.md)"
            exit 1
          fi
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)apksigner"
          keystore="$RUNNER_TEMP/release.p12"
          trap 'rm -f "$keystore"' EXIT
          (umask 077 && echo "$APK_KEYSTORE_BASE64" | base64 -d > "$keystore")
          expected="$(echo "$APK_CERT_SHA256" | tr -d ': ' | tr 'A-F' 'a-f')"
          for apk in dist/*.apk; do
            # The password goes through the environment, never the command line.
            "$apksigner" sign --ks "$keystore" --ks-type PKCS12 --ks-key-alias "$APK_KEY_ALIAS" \
              --ks-pass env:APK_KEYSTORE_PASSWORD "$apk"
            # Exactly one signer, and it is the published certificate.
            certs="$("$apksigner" verify --print-certs "$apk" | grep 'certificate SHA-256 digest' | sort -u)"
            if [ "$(echo "$certs" | wc -l)" -ne 1 ] || [ "${certs##*: }" != "$expected" ]; then
              echo "::error::$apk is not signed by the expected certificate only"
              exit 1
            fi
          done
          # v4 signature files, only useful for incremental adb installs.
          rm -f dist/*.idsig
          echo "Signed with certificate SHA-256 $expected"
      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" --clobber dist/* --repo "$GITHUB_REPOSITORY"
