name: iOS (untested)

# Unsigned iOS build, for sideloading (AltStore, SideStore, Sideloadly...,
# which sign it with the user's own Apple ID). UNTESTED: nobody on the
# project has an iPhone. Kept apart from release.yml so a failure here never
# blocks the Android release.
# Runs only when a release is published: attaches the .ipa (and its
# SHA-256) to the release.
on:
  release:
    types: [published]

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.7

jobs:
  ipa:
    name: Unsigned IPA
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: write # upload release assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Version
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          IFS='.' read -r major minor patch <<< "${version%%-*}"
          # iOS wants a plain x.y.z version (no "-0.40" game suffix) in the app.
          echo "short=${version%%-*}" >> "$GITHUB_OUTPUT"
          echo "name=$version" >> "$GITHUB_OUTPUT"
          echo "code=$(( major * 10000 + minor * 100 + patch ))" >> "$GITHUB_OUTPUT"
      - name: Build
        working-directory: app
        env:
          SHORT: ${{ steps.version.outputs.short }}
          CODE: ${{ steps.version.outputs.code }}
        run: |
          flutter pub get
          flutter gen-l10n
          flutter build ios --release --no-codesign --obfuscate --split-debug-info=build/symbols \
            --build-name="$SHORT" --build-number="$(( CODE > 0 ? CODE : 1 ))"
      - name: Package the IPA
        env:
          NAME: ${{ steps.version.outputs.name }}
        run: |
          mkdir -p dist "$RUNNER_TEMP/ipa/Payload"
          cp -R app/build/ios/iphoneos/Runner.app "$RUNNER_TEMP/ipa/Payload/"
          ipa="Beam-RemotePlus-$NAME-ios-UNTESTED-unsigned.ipa"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$GITHUB_WORKSPACE/dist/$ipa" Payload)
          (cd dist && shasum -a 256 "$ipa" > "$ipa.sha256")
          ls -l dist
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" --clobber dist/* --repo "$GITHUB_REPOSITORY"
