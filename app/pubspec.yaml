name: beam_remoteplus
description: "Drive BeamNG.drive from your phone (companion app of the Beam-RemotePlus mod)."
publish_to: 'none'

# version is overridden in CI from the release tag (--build-name/--build-number).
version: 2.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: 0.20.3 # version pinned by flutter_localizations
  # Pairing QR code shown by BeamNG.drive
  mobile_scanner: ^6.0.2
  # Accelerometer for tilt steering
  sensors_plus: ^6.1.1
  # Runtime camera permission (Android 6+)
  permission_handler: ^11.3.1
  # Wi-Fi broadcast address for discovery
  network_info_plus: ^6.1.3
  # Phone name sent during pairing (shown in game, local multiplayer)
  device_info_plus: ^11.2.0
  # Keeps the screen on while driving
  wakelock_plus: ^1.2.8
  # Persisted user settings
  shared_preferences: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  # Generates AppLocalizations from lib/l10n/*.arb (see l10n.yaml)
  generate: true
