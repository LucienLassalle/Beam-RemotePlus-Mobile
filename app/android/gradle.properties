org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# Use the Google Play services barcode model instead of bundling ML Kit
# in the APK (~2.4 MB per CPU architecture saved, model downloaded once).
dev.steenbakker.mobile_scanner.useUnbundled=true
# AGP 9 opt-outs, as in the Flutter template (the Flutter Gradle plugin does
# not support the new DSL and built-in Kotlin yet).
android.newDsl=false
android.builtInKotlin=false
